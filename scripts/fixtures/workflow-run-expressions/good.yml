on: pull_request
jobs:
  validate:
    name: Validate ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_plugins == 'true'
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - name: Check plugin structure
        run: |
          test -d "plugins/$PLUGIN"
          python3 - <<'PYEOF'
          import os
          print(os.environ["PLUGIN"])
          PYEOF
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.plugin }}
          path: dist/
      - run: bash scripts/package-plugin.sh "$PLUGIN" /tmp/dist-test
        env:
          TITLE: ${{ github.event.pull_request.title }}
