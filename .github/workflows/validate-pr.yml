name: Validate Plugin PR

# Runs on every PR targeting main that touches plugins/
# Validates structure, plugin.json schema, and SOSA compliance.

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      # Card 1zBkhSZm: the manifest was NOT a trigger, so a PR that edited only
      # .claude-plugin/marketplace.json ran none of these jobs — including the
      # coverage check below, whose whole subject is that file.
      - '.claude-plugin/**'

# Card DMqfyLzZ: no job here writes to the repo or the PR, so the token gets
# read-only scope instead of the repo default.
permissions:
  contents: read

jobs:
  # ── Job 1: Detect which plugins are in this PR ───────────────────
  detect:
    name: Detect Changed Plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      has_plugins: ${{ steps.detect.outputs.has_plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed plugins
        id: detect
        # Card IcsmluvI: the names found here become the validate job's matrix
        # entries. They come from the PR's own file paths, so they are
        # attacker-controlled. Every name that is still a directory must match
        # ^[a-z0-9-]+$ or this step FAILS the run (it does not skip the entry:
        # a skipped directory would merge without ever being validated).
        # Paths are read NUL-separated (-z), so a name with a quote, newline
        # or "$(...)" reaches the check as written and is rejected there.
        run: |
          git diff --name-only -z origin/main...HEAD > "$RUNNER_TEMP/changed-files.z"
          python3 - "$RUNNER_TEMP/changed-files.z" <<'PYEOF'
          import json, os, re, sys

          SAFE = re.compile(r"^[a-z0-9-]+$")

          with open(sys.argv[1], "rb") as f:
              paths = [p for p in f.read().decode("utf-8", "surrogateescape").split("\0") if p]

          # Card 4vgdDPNS: a DELETED plugin dir is not a plugin to validate, so
          # only names that still exist as directories are kept.
          names = sorted({
              p.split("/")[1]
              for p in paths
              if p.startswith("plugins/") and len(p.split("/")) > 2 and p.split("/")[1]
          })
          names = [n for n in names if os.path.isdir(os.path.join("plugins", n))]

          bad = [n for n in names if not SAFE.fullmatch(n)]
          if bad:
              for n in bad:
                  # ascii() escapes quotes, control characters and newlines, so
                  # the name cannot break out of this annotation line.
                  print(f"::error::Plugin directory name {ascii(n)} is not allowed: "
                        "plugin directory names must match ^[a-z0-9-]+$ (lowercase letters, digits, hyphens).")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_plugins={'true' if names else 'false'}\n")
              out.write(f"plugins={json.dumps(names)}\n")

          print("Plugins in this PR: " + (", ".join(names) if names else "(none)"))
          PYEOF

  # ── Job 2: Validate each changed plugin ─────────────────────────
  validate:
    name: Validate ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_plugins == 'true'
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
      fail-fast: false

    # Card IcsmluvI: the matrix entry reaches the shell and Python ONLY
    # through this env var, never by expression text interpolation inside a
    # run: body (a directory name is attacker-controlled PR input).
    env:
      PLUGIN: ${{ matrix.plugin }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Structure check ─────────────────────────────────────
      - name: Check plugin structure
        run: |
          # Defence in depth: detect already refuses any other name.
          if [[ ! "$PLUGIN" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Plugin directory name is not allowed: must match ^[a-z0-9-]+\$"
            exit 1
          fi
          ERRORS=0

          if [[ ! -d "plugins/$PLUGIN/.claude-plugin" ]]; then
            echo "::error file=plugins/$PLUGIN::Missing .claude-plugin/ directory"
            ERRORS=$((ERRORS + 1))
          fi

          if [[ ! -f "plugins/$PLUGIN/.claude-plugin/plugin.json" ]]; then
            echo "::error file=plugins/$PLUGIN/.claude-plugin/plugin.json::Missing plugin.json"
            ERRORS=$((ERRORS + 1))
          fi

          if [[ ! -f "plugins/$PLUGIN/README.md" ]]; then
            echo "::warning file=plugins/$PLUGIN/README.md::Missing README.md — strongly recommended"
          fi

          SKILL_COUNT=$(find "plugins/$PLUGIN" -name "SKILL.md" | wc -l)
          if [[ "$SKILL_COUNT" -eq 0 ]]; then
            echo "::error file=plugins/$PLUGIN::No SKILL.md found — every plugin needs at least one skill"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ Found $SKILL_COUNT SKILL.md file(s)"
          fi

          if [[ "$ERRORS" -gt 0 ]]; then
            exit 1
          fi
          echo "✓ Structure valid"

      # ── 2. plugin.json schema validation ─────────────────────────
      - name: Validate plugin.json schema
        run: |
          python3 - <<'PYEOF'
          import json, sys, re, os

          path = f"plugins/{os.environ['PLUGIN']}/.claude-plugin/plugin.json"

          try:
              with open(path) as f:
                  d = json.load(f)
          except Exception as e:
              print(f"::error file={path}::Invalid JSON: {e}")
              sys.exit(1)

          errors = []
          warnings = []

          for field in ['name', 'version', 'description', 'author', 'license']:
              if field not in d:
                  errors.append(f"Missing required field: {field}")

          ver = d.get('version', '')
          if not re.match(r'^\d+\.\d+\.\d+$', ver):
              errors.append(f"Invalid version format '{ver}' — must be semver (x.y.z)")

          author = d.get('author', {})
          if isinstance(author, dict) and 'name' not in author:
              errors.append("author.name is required")

          if 'sosa' not in d:
              warnings.append("Missing sosa block — recommended for marketplace compliance")
          else:
              for pillar in ['supervised', 'orchestrated', 'secured', 'agents']:
                  if pillar not in d['sosa'].get('pillars', {}):
                      warnings.append(f"sosa.pillars.{pillar} not documented")

          if 'platforms' not in d:
              warnings.append("platforms not specified — recommended: ['claude-code', 'cowork']")

          for w in warnings:
              print(f"::warning file={path}::{w}")

          if errors:
              for e in errors:
                  print(f"::error file={path}::{e}")
              sys.exit(1)

          print(f"✓ plugin.json valid (v{d.get('version','?')})")
          PYEOF

      # ── 3. SKILL.md quality check ─────────────────────────────
      - name: Check SKILL.md quality
        run: |
          ISSUES=0

          while IFS= read -r skill_file; do
            SKILL_NAME=$(dirname "$skill_file" | xargs basename)
            WORD_COUNT=$(wc -w < "$skill_file")
            LINE_COUNT=$(wc -l < "$skill_file")

            if ! head -3 "$skill_file" | grep -q "^---"; then
              echo "::error file=$skill_file::Missing YAML frontmatter (---)"
              ISSUES=$((ISSUES + 1))
            fi

            if [[ "$WORD_COUNT" -gt 3000 ]]; then
              echo "::warning file=$skill_file::$SKILL_NAME is $WORD_COUNT words — exceeds 3000 word budget"
            fi

            echo "✓ $SKILL_NAME: ${WORD_COUNT}w / ${LINE_COUNT}l"
          done < <(find "plugins/$PLUGIN" -name "SKILL.md")

          if [[ "$ISSUES" -gt 0 ]]; then
            exit 1
          fi

      # ── 4. Secret scan ────────────────────────────────────────
      - name: Scan for hardcoded secrets
        run: |
          FOUND=0

          PATTERNS=(
            'api[_-]?key\s*[=:]\s*["\x27][A-Za-z0-9_\-]{10,}'
            'secret\s*[=:]\s*["\x27][A-Za-z0-9_\-]{10,}'
            'password\s*[=:]\s*["\x27][^"\x27]{6,}'
            'token\s*[=:]\s*["\x27][A-Za-z0-9_\-\.]{20,}'
            'sk-[a-zA-Z0-9]{20,}'
            'xoxb-[0-9A-Za-z\-]+'
          )

          for pattern in "${PATTERNS[@]}"; do
            if grep -rniP "$pattern" "plugins/$PLUGIN/" \
               --include="*.ts" --include="*.js" --include="*.py" \
               --include="*.json" --include="*.md" \
               --exclude-dir="node_modules" 2>/dev/null; then
              echo "::error::Potential hardcoded secret detected"
              FOUND=1
            fi
          done

          if find "plugins/$PLUGIN" -name ".env" | grep -q .; then
            echo "::error::.env file found — never commit secrets"
            FOUND=1
          fi

          if [[ "$FOUND" -eq 1 ]]; then exit 1; fi
          echo "✓ No secrets detected"

      # ── 5. Dry-run package build ───────────────────────────────
      - name: Dry-run package build
        run: |
          chmod +x scripts/package-plugin.sh
          bash scripts/package-plugin.sh "$PLUGIN" /tmp/dist-test
          echo "✓ Package build succeeded"

  # ── Job 3: SOSA compliance (repo-wide) ──────────────────────────
  sosa:
    name: SOSA Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SOSA lint
        run: |
          chmod +x scripts/sosa-lint.sh
          bash scripts/sosa-lint.sh .

      - name: SOSA eval (CI gate)
        run: |
          chmod +x scripts/sosa-eval.sh
          bash scripts/sosa-eval.sh . --ci

      # ── Card 1zBkhSZm ──────────────────────────────────────────
      # 33 plugin directories, 30 manifest entries, and nothing in this
      # workflow compared the two — so opsagent-shopify carried a RELEASED tag
      # (v0.3.7, 2026-08-26) pointing at content no user could install, for
      # over a week, with every build green. The success signal and the failure
      # signal were the same green build.
      - name: Marketplace coverage — plugins/ vs the manifest
        run: python3 scripts/check-marketplace-coverage.py --root .

      # The card's AC-3 asks for this explicitly: "Pair it with a negative
      # control — add a fixture that omits one entry and prove the check reds —
      # or it is a guard that has only ever seen passing input." This step
      # EXECUTES the red branch on every run, against committed fixtures.
      - name: Marketplace coverage — prove the guard can FAIL
        run: python3 scripts/check-marketplace-coverage.test.py

      # ── Card okOoGKTA ──────────────────────────────────────────
      # release.yml bumped plugin.json but never marketplace.json, so 17 of 33
      # listings advertised a stale version with every build green. Fail a PR
      # where any marketplace.json version differs from its plugin.json.
      - name: Marketplace versions — manifest vs plugin.json
        run: python3 scripts/marketplace-versions.py --root .

      # Negative control: the red branch (a deliberately drifted fixture) and
      # the bump-version.sh integration run on every build, not once by hand.
      - name: Marketplace versions — prove the guard can FAIL
        run: python3 scripts/marketplace-versions.test.py

      # ── Card czICbElh ──────────────────────────────────────────
      # Nothing here ever read .lsp.json or an inline lspServers block, so an
      # LSP plugin with a key Claude Code rejects (startupTimeoutMs for
      # startupTimeout) merged and published green while the loader dropped
      # the whole file. The allowed-key list is pinned in the script.
      - name: LSP server configs — schema check
        run: python3 scripts/check-lsp-config.py --root .

      # Negative control: committed fixtures (startupTimeoutMs, missing
      # command, unknown inline key, ...) must red on every run.
      - name: LSP server configs — prove the guard can FAIL
        run: python3 scripts/check-lsp-config.test.py

      # ── Card IcsmluvI ──────────────────────────────────────────
      # The matrix entry (a directory name from the PR's own files) was pasted
      # into run: scripts as text, so a directory named with a command
      # substitution ran it on the runner. Fail any expression inside a run:
      # body of this workflow; values go through env: instead.
      - name: Workflow run bodies — no expression interpolation
        run: python3 scripts/check-workflow-run-expressions.py --root .

      # Negative control: committed fixtures that interpolate into run: bodies
      # (block, heredoc, inline, folded) must red on every run.
      - name: Workflow run bodies — prove the guard can FAIL
        run: python3 scripts/check-workflow-run-expressions.test.py
